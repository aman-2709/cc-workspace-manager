[package]
name = "cc-workspace-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Discover, track, and resume your Claude Code projects. Independent, unofficial; not affiliated with Anthropic."
license = "MIT"
publish = false
default-run = "ccwm"

[[bin]]
name = "ccwm"
path = "src/main.rs"

[[bin]]
name = "ccwm-synth"
path = "src/bin/ccwm-synth.rs"

# Landlock must be applied while the process is single-threaded; libtest runs tests on threads,
# so the sandbox test brings its own main (see tests/sandbox.rs).
[[test]]
name = "sandbox"
harness = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
getrandom = "0.4.3"
hyper = { version = "1.13.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "service"] }
ignore = "0.4.35"
landlock = "0.4.8"
nix = { version = "0.32.0", features = ["dir", "fs", "user", "process", "signal", "socket"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
