# CC Workspace Manager: example configuration.
# Copy to $XDG_CONFIG_HOME/ccwm/config.toml (default ~/.config/ccwm/config.toml).
# The file is read when the daemon starts; unknown keys are errors.

[server]
# TCP port on 127.0.0.1 (1024-65535). `ccwm serve --port N` overrides it.
port = 8765

[discovery]
# Directories to search for projects (absolute paths). Empty = your home directory.
roots = []
# Extra exclusions, gitignore syntax, relative to each root.
# Hidden directories, node_modules, target, build, dist, venv and __pycache__ are always skipped.
exclude = []
# How many directory levels below a root are searched.
max_depth = 10
# Stay on the root's file system (do not descend into other mounts).
same_file_system = true
# Seconds between background reconciliation scans (60-86400). `ccwm scan` triggers one now.
scan_interval_secs = 600
# Projects that are not found are marked missing and deleted from ccwm's index after this many
# days (1-3650). Your files are never touched.
missing_retention_days = 30
# Projects are found mainly from Claude Code sessions (their recorded working directories). The
# CLAUDE.md marker walk covers every root once (the first launch), then only the "development
# roots": the parent folders of projects found from sessions. true walks every root at every scan.
full_scan = false

[watch]
# Maximum inotify watches ccwm uses. 0 = automatic: 25 % of fs.inotify.max_user_watches
# (8192 if the limit cannot be read). Every project root is watched first, then top-level
# folders, then deeper folders of the most recently active projects; folders without a watch
# are checked at each scan instead of live ("partly watched" / "polled").
budget = 0
# File events of one project are combined for this long before they are recorded (100-60000 ms).
debounce_ms = 2000

[activity]
# Calendar days since the last change (system time zone): 0 = today, 1 to inactive-1 = recent,
# inactive to dormant-1 = inactive, dormant or more = dormant.
inactive_after_days = 7
dormant_after_days = 30
# Recent file events kept per project.
events_per_project = 200

[git]
# Git older than 2.41.0 cannot be hardened against filter drivers (no --attr-source), so worktree
# status is disabled there. true re-enables it WITHOUT that protection. Not recommended.
allow_unhardened_status = false

[sessions]
# Claude Code's config directory, which holds the session files (projects/). Unset (the default):
# $CLAUDE_CONFIG_DIR, else ~/.claude. Must be an absolute path.
# dir = "/home/you/.claude"
# Cache the last prompt (redacted) in ccwm's database for a faster detail panel. Off: prompts are
# read from the session file only when you open a project's details, and never stored.
store_prompt_text = false

[ui]
# Defaults for browsers that have not chosen yet: view (cards or table), theme (system, light,
# dark) and privacy mode (hides paths, user names, remote URLs, session titles and prompts).
default_view = "cards"
theme = "system"
privacy = false

[indicator]
# The session activity indicator (docs/session-hooks.md; opt-in through Claude Code hooks). Show
# non-interactive sessions too (`claude -p`, SDK hosts such as editor extensions); hidden by default.
show_noninteractive = false
