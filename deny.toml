# cargo-deny configuration. CI runs `cargo deny check` (M4). Locally (M1.1, cargo-deny 0.21.0; 0.22 needs
# rustc 1.95):  cargo install --locked --root target/tools cargo-deny --version 0.21.0
#               target/tools/bin/cargo-deny check
# REQUIREMENTS.md §11.5: HTTP/network client crates and DNS resolvers are banned.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Known duplicate: proc-macro crates not yet on syn 3 (enumflags2_derive via landlock, tracing-attributes).
# Build-time only; revisit when they upgrade.
skip = [
  { crate = "syn@2.0.119", reason = "enumflags2_derive (landlock) and tracing-attributes still depend on syn 2" },
]
deny = [
  { crate = "reqwest", reason = "HTTP client (zero external network communication)" },
  { crate = "ureq", reason = "HTTP client" },
  { crate = "curl", reason = "HTTP client" },
  { crate = "curl-sys", reason = "HTTP client" },
  { crate = "isahc", reason = "HTTP client" },
  { crate = "attohttpc", reason = "HTTP client" },
  { crate = "surf", reason = "HTTP client" },
  { crate = "minreq", reason = "HTTP client" },
  { crate = "hyper-tls", reason = "HTTP client TLS connector" },
  { crate = "hyper-rustls", reason = "HTTP client TLS connector" },
  { crate = "native-tls", reason = "TLS client" },
  { crate = "openssl", reason = "TLS client" },
  { crate = "rustls", reason = "TLS client" },
  { crate = "trust-dns-resolver", reason = "DNS resolver" },
  { crate = "hickory-resolver", reason = "DNS resolver" },
  { crate = "hickory-client", reason = "DNS client" },
  { crate = "c-ares", reason = "DNS resolver" },
]

# The axum server pulls in hyper and hyper-util; their *client* features must stay off.
[[bans.features]]
crate = "hyper"
deny = ["client"]

[[bans.features]]
crate = "hyper-util"
deny = ["client", "client-legacy", "client-proxy", "client-pool"]

[advisories]
version = 2

[licenses]
version = 2
# Exactly the licenses in the dependency tree (cargo deny list); a new one must be reviewed and added.
# M2 (all through the spec-named `notify` watcher, all permissive and MIT-compatible; flagged to the
# maintainer for review): ISC (inotify, inotify-sys), CC0-1.0 (notify), BSL-1.0 (xxhash-rust).
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Unlicense", "Zlib", "ISC", "CC0-1.0", "BSL-1.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
