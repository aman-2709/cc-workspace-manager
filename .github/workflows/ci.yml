# CI (REQUIREMENTS.md §17): fmt, clippy, test (incl. the §16 hygiene check), cargo-deny, gitleaks.
# Every action is pinned to a full commit SHA (version in the comment). Rust is installed with rustup,
# no toolchain action.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # Explicit `bash` gives `-eo pipefail`, so `cargo test | tee` fails when cargo does.
    shell: bash

env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_DENY_VERSION: 0.21.0
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz: matches the release's gitleaks_8.30.1_checksums.txt and
  # the digest GitHub records for the asset.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c rustfmt,clippy
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c rustfmt,clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c rustfmt,clippy
      - name: Install strace (security acceptance test 5, strace variant)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
      # Ephemeral runner only: lets unprivileged user namespaces work for test 5's network-namespace variant.
      - name: "Runner setup (sudo on the ephemeral runner): allow unprivileged user namespaces"
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Report what the runner actually provides and require only that coverage from the tests.
      - name: Probe sandbox and kernel features
        run: |
          python3 - <<'EOF'
          import ctypes, os

          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long

          # landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION) = syscall 444, flags 1.
          abi = libc.syscall(ctypes.c_long(444), ctypes.c_long(0), ctypes.c_long(0), ctypes.c_long(1))
          if abi >= 1:
              landlock = f"ABI {abi}"
          else:
              abi = 0
              landlock = f"unavailable ({os.strerror(ctypes.get_errno())})"

          def read(path):
              try:
                  with open(path) as f:
                      return f.read().strip()
              except OSError as e:
                  return f"unreadable ({e.strerror})"

          fd = libc.inotify_init1(0)
          if fd >= 0:
              os.close(fd)
              inotify_ok, inotify = True, "inotify_init1 ok"
          else:
              inotify_ok, inotify = False, f"inotify_init1 failed ({os.strerror(ctypes.get_errno())})"

          rows = [
              ("Kernel", os.uname().release),
              ("Landlock", landlock),
              ("inotify", inotify),
              ("inotify max_user_instances", read("/proc/sys/fs/inotify/max_user_instances")),
              ("inotify max_user_watches", read("/proc/sys/fs/inotify/max_user_watches")),
              ("apparmor_restrict_unprivileged_userns", read("/proc/sys/kernel/apparmor_restrict_unprivileged_userns")),
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## Runner capabilities (probed)\n\n| Feature | Result |\n|---|---|\n")
              s.writelines(f"| {k} | {v} |\n" for k, v in rows)
          with open(os.environ["GITHUB_ENV"], "a") as e:
              if abi >= 1:
                  e.write("CCWM_REQUIRE_LANDLOCK=1\n")
              if inotify_ok:
                  e.write("CCWM_REQUIRE_INOTIFY=1\n")
          EOF

          probe() { # <label> <command...>: one summary row; returns the command's status
            local label=$1; shift
            if "$@" >/dev/null 2>&1; then
              echo "| $label | works |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $label | fails (exit $?) |" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }
          probe 'strace: strace -f -qq -e trace=connect,execve -o /dev/null true' \
            strace -f -qq -e trace=connect,execve -o /dev/null true || true
          if probe 'user+net namespace: unshare --user --map-current-user --net true' \
            unshare --user --map-current-user --net true; then
            echo "CCWM_REQUIRE_NETNS=1" >> "$GITHUB_ENV"
          fi
          # Informational: test 5's wrapper also brings the loopback interface up inside the namespace.
          probe 'test 5 namespace wrapper: unshare ... --keep-caps --net -- sh -c "ip link set lo up"' \
            unshare --user --map-current-user --keep-caps --net -- sh -c 'ip link set lo up' || true
      - name: Report the required coverage
        run: |
          {
            echo
            echo "## Coverage the tests are required to run"
            echo
            echo "- CCWM_REQUIRE_LANDLOCK=${CCWM_REQUIRE_LANDLOCK:-unset}"
            echo "- CCWM_REQUIRE_INOTIFY=${CCWM_REQUIRE_INOTIFY:-unset}"
            echo "- CCWM_REQUIRE_NETNS=${CCWM_REQUIRE_NETNS:-unset}"
            echo
            echo "Unset means the runner lacks the feature: those tests may skip (see the notices below)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cargo test
        run: cargo test --locked -- --show-output 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Copy test notices (skipped coverage) to the summary
        if: always()
        run: |
          {
            echo
            echo "## Test notices"
            echo
            echo '```'
            grep -F 'NOTICE:' "$RUNNER_TEMP/test.log" || echo "(no NOTICE lines)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ runner.os }}
      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/cargo-deny cargo-deny --version "$CARGO_DENY_VERSION"
      # Licenses, advisories, sources and the network-crate bans (REQUIREMENTS.md §11.5).
      - run: ~/cargo-deny/bin/cargo-deny --locked check

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the full history is scanned
          persist-credentials: false
      # The release binary with a pinned checksum instead of gitleaks-action (which needs a license for
      # organization repositories).
      - name: Install gitleaks (SHA-256 verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: gitleaks over the full history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --exit-code 1 .'
